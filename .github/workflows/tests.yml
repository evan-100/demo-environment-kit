name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes exact versions only (no moving v10 tag), so pin one.
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      # No HUBSPOT_TOKEN in CI, so the live HubSpot tests are skipped.
      - run: uv run pytest -q
